<!doctype html>
<html lang="de">
<head>
<link rel="icon" href="favicon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#13110d">
<meta name="color-scheme" content="dark">
<title>PoE Companion</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="result.css">
<link rel="stylesheet" href="hub.css">
<link rel="stylesheet" href="poe.css">
</head>
<body>
<div id="hubbar" data-drag title="Zum Verschieben ziehen, Doppelklick zum Maximieren"><span class="hb-t"><img src="logo.svg" alt="" width="14" height="14">PoE Companion</span>
  <button class="hb-b" id="hbmin" title="Minimieren"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.5h8" stroke="currentColor" stroke-width="1.4"/></svg></button>
  <button class="hb-b" id="hbmax" title="Maximieren"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
  <button class="hb-b x" id="hbx" title="Schließen (läuft im Hintergrund weiter)"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
<div id="shell">
  <aside id="side">
    <div class="brand"><div class="mark"></div><div><div class="bn"><span>PoE</span> Companion</div><div class="bs">für Path of Exile 1 &amp; 2</div></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="prof" id="prof"></div>
      <div class="stat" id="stat"></div>
    </div>
  </aside>
  <main id="main">
    <section data-v="home"></section>
    <section data-v="quest"></section>
    <section data-v="tree"></section>
    <section data-v="level"></section>
    <section data-v="items"></section>
    <section data-v="maps"></section>
    <section data-v="upgrades"></section>
    <section data-v="craft"></section>
    <section data-v="timeless"></section>
    <section data-v="stash"></section>
    <section data-v="profiles"></section>
    <section data-v="settings"></section>
    <section data-v="help"></section>
  </main>
</div>
<script src="data/tree_3_29.js"></script>
<script src="core.js"></script>
<script>App.overlay('hub');
document.getElementById('hbmin').onclick = () => App.api('/api/window', { name: 'hub', action: 'min' });
document.getElementById('hbmax').onclick = () => App.api('/api/window', { name: 'hub', action: 'max' });
document.getElementById('hbx').onclick = () => App.api('/api/window', { name: 'hub', action: 'hide' });
document.getElementById('hubbar').ondblclick = e => { if (!e.target.closest('button')) App.api('/api/window', { name: 'hub', action: 'max' }); };</script>
<script src="data/i18n_en.js"></script>
<script src="i18n.js"></script>
<script src="render.js"></script>
<script src="treeview.js"></script>
<script src="data/asc_3_29.js"></script>
<script src="data/tree_poe2.js"></script>
<script src="asc.js"></script>
<script src="hub.js"></script>
<script src="start.js"></script>
<script src="data/campaign.js"></script>
<script src="data/campaign_en.js"></script>
<script src="data/campaign_poe2.js"></script>
<script>I18N.kampagne();</script>
<script src="quest.js"></script>
<script src="data/gemsrc.js"></script>
<script src="gems.js"></script>
<script src="qol.js"></script>
<script src="upgrades.js"></script>
<script src="craft.js"></script>
<script src="timeless.js"></script>
<script src="help.js"></script>
<script src="trade.js"></script>
<script src="stash.js"></script>
</body>
</html>
